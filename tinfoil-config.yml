{
  "cvm-version": "0.14.13",
  "cpus": 4,
  "memory": 65536,
  "gpus": 1,
  "models": [
    {
      "name": "nomic-embed-text-v1.5",
      "repo": "nomic-ai/nomic-embed-text-v1.5@e5cf08aadaa33385f5990def41f7a23405aec398",
      "mpk": "868790ff0e4820086091a6a63097f194a0a17bc431dd616538eb7881ecdbd935_2215256064_328142c7-83ed-5f89-a463-0a11367cf58f"
    }
  ],
  "containers": [
    {
      "name": "nomic-embed-text-v1.5",
      "image": "ghcr.io/huggingface/text-embeddings-inference:100-1.9@sha256:16be3893ada5d7decaa60bb08b5cd021504b783bfd87ab1473ebacae7026add3",
      "runtime": "nvidia",
      "gpus": "all",
      "restart": "always",
      "command": [
        "--model-id",
        "/tinfoil/mpk/mpk-868790ff0e4820086091a6a63097f194a0a17bc431dd616538eb7881ecdbd935",
        "--served-model-name",
        "nomic-embed-text",
        "--port",
        "8001",
        "--disable-spans"
      ],
      "tmpfs": {
        "/tmp": "size=512m,mode=1777,exec",
        "/root": "size=2g,mode=0700,exec"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "-sf",
          "http://localhost:8001/health"
        ],
        "interval": "30s",
        "timeout": "5s",
        "start_period": "60m"
      },
      "networks": [
        "nvidia",
        "model-wire"
      ],
      "entrypoint": [
        "/bin/sh",
        "-c",
        "exec ./entrypoint.sh \"$@\" >/dev/null 2>&1",
        "opal-private-engine"
      ],
      "env": [
        {
          "LOG_LEVEL": "off"
        },
        {
          "HF_HUB_DISABLE_TELEMETRY": "1"
        },
        {
          "OTEL_SDK_DISABLED": "true"
        }
      ]
    },
    {
      "name": "opal-model-wire-gateway",
      "image": "us-central1-docker.pkg.dev/myco-437401/opal-tinfoil/model-wire-gateway@sha256:02996b019f60d94f14a9bce8d01b125979af3e3dc93f4b8fbb3da94633887ba2",
      "networks": [
        "model-wire"
      ],
      "restart": "always",
      "command": [
        "--service",
        "nomic-embed-text",
        "--upstream",
        "http://nomic-embed-text-v1.5:8001",
        "--port",
        "8002"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=5).read()"
        ],
        "interval": "30s",
        "timeout": "5s",
        "start_period": "60m"
      },
      "entrypoint": [
        "/bin/sh",
        "-c",
        "exec python /opt/opal-model-wire/wire_gateway.py \"$@\" >/dev/null 2>&1",
        "opal-private-gateway"
      ]
    }
  ],
  "shim": {
    "upstream-port": 8002,
    "authenticated": true,
    "authenticated-endpoints": [
      "/v1/embeddings",
      "/opal-wire-status"
    ],
    "paths": [
      "/v1/embeddings",
      "/health",
      "/opal-wire-status"
    ],
    "upstream-container": "opal-model-wire-gateway"
  },
  "networks": {
    "nvidia": {
      "egress": "allowlist",
      "allow": [
        "edge.urm.nvidia.com",
        "openaipublic.blob.core.windows.net"
      ]
    },
    "model-wire": {
      "egress": "closed"
    }
  }
}
